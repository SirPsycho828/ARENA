<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebRTC Shared Token Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@touchcastllc/napster-companion-api@latest/lib/index.css" />
  <style>
    body { font-family: system-ui; background: #111; color: #eee; padding: 20px; }
    h1 { color: #00f0ff; }
    #controls { margin: 20px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button { padding: 8px 16px; background: #00f0ff; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #00c8d4; }
    .btn-green { background: #00ff88; }
    .btn-green:hover { background: #00cc6a; }
    #avatar-container { width: 480px; height: 360px; background: #1a1a2e; border: 2px solid #333; border-radius: 8px; overflow: hidden; position: relative; }
    #status { margin-top: 10px; padding: 10px; background: #1a1a1a; border-radius: 4px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    .tab-id { color: #ff2d6b; font-weight: bold; }
    .token-status { color: #00ff88; font-size: 14px; }
  </style>
</head>
<body>
  <h1>WebRTC Shared Token Test</h1>
  <p>Open this page in <strong>two tabs</strong>. Click <strong>Load Token</strong> in both, then <strong>Connect</strong>.</p>
  <p>Tab ID: <span class="tab-id" id="tab-id"></span></p>

  <div id="controls">
    <button class="btn-green" onclick="loadToken()">Load Fresh Token</button>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <span class="token-status" id="token-status"></span>
  </div>

  <div id="avatar-container"></div>
  <div id="status">Click "Load Fresh Token" to begin...</div>

  <script src="https://cdn.jsdelivr.net/npm/@touchcastllc/napster-companion-api@latest/lib/index.standalone.js"></script>
  <script>
    const tabId = 'Tab-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    document.getElementById('tab-id').textContent = tabId;
    let instance = null;
    let currentToken = null;

    function log(msg) {
      const el = document.getElementById('status');
      const time = new Date().toLocaleTimeString();
      el.textContent += `[${time}] [${tabId}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    async function loadToken() {
      try {
        log('Loading token from fresh-token.txt...');
        const res = await fetch('/fresh-token.txt?t=' + Date.now());
        if (!res.ok) throw new Error('File not found. Run: node test/get-webrtc-token.js');
        currentToken = (await res.text()).trim();
        document.getElementById('token-status').textContent =
          `Token loaded (${currentToken.length} chars)`;
        log('Token loaded! ' + currentToken.slice(0, 40) + '...');
      } catch (err) {
        log('ERROR loading token: ' + err.message);
      }
    }

    async function connect() {
      if (!currentToken) { log('ERROR: Load token first!'); return; }

      log('Connecting with token (' + currentToken.length + ' chars)...');

      try {
        const sdk = window.napsterCompanionApiSDK;
        instance = await sdk.init(currentToken, {
          mountContainer: '#avatar-container',
          position: 'center',
          onData: (data) => {
            log('EVENT: ' + JSON.stringify(data).slice(0, 300));
          },
        });
        log('SUCCESS: SDK initialized!');
        // Show avatar explicitly (per Napster docs)
        if (instance.showAvatar) {
          instance.showAvatar();
          log('Called showAvatar()');
        }
        log('Session ID: ' + (instance.sessionId || 'N/A'));
      } catch (err) {
        log('ERROR: ' + err.message);
        console.error(err);
      }
    }

    function disconnect() {
      if (instance) {
        instance.destroy();
        instance = null;
        log('Disconnected');
      }
    }
  </script>
</body>
</html>
