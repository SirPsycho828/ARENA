<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #0D1117; }
    .dot { fill: #E63946; }
    .ring1 { fill: none; stroke: #E63946; stroke-width: 1.5; opacity: 0.5; }
    .ring2 { fill: none; stroke: #E63946; stroke-width: 1; opacity: 0.25; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #F0F4F8; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <circle class="dot" cx="16" cy="16" r="5"/>
  <circle class="ring1" cx="16" cy="16" r="9"/>
  <circle class="ring2" cx="16" cy="16" r="13"/>
</svg>
