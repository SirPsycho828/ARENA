<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ARENA Avatar Host</title>
  <style>
    body { margin: 0; background: #000; display: flex; gap: 4px; }
    iframe { width: 420px; height: 420px; border: none; }
  </style>
</head>
<body>
  <div id="frames"></div>

  <script src="https://unpkg.com/livekit-client@1.15.13/dist/livekit-client.umd.js"></script>
  <script>
    const { Room, RoomEvent, Track, LocalVideoTrack, LocalAudioTrack } = LivekitClient;

    const avatarFrames = {}; // agentId -> { iframe, ready: boolean }
    let livekitRoom = null;
    window.__hostReady = false;

    // ─── initHost: called by Puppeteer after exposeFunction setup ─────
    window.initHost = async function(config) {
      console.log('[Host] initHost called with', config.agents.length, 'agents');
      const framesDiv = document.getElementById('frames');

      // Create iframes and wait for all avatars to be ready
      const readyPromises = config.agents.map((agent) => {
        return new Promise((resolve, reject) => {
          const iframe = document.createElement('iframe');
          iframe.src = '/avatar-host/avatar-frame.html';
          iframe.style.cssText = 'width:420px;height:420px;border:none;';
          iframe.allow = 'autoplay; camera; microphone';
          framesDiv.appendChild(iframe);

          avatarFrames[agent.id] = { iframe, ready: false };

          const timeout = setTimeout(() => reject(new Error(`Avatar ${agent.id} timeout`)), 45000);

          window.addEventListener('message', function handler(e) {
            if (e.source !== iframe.contentWindow) return;

            if (e.data?.type === 'frame-ready') {
              iframe.contentWindow.postMessage({
                type: 'init-avatar',
                token: agent.token,
                agentId: agent.id,
              }, '*');
            }

            if (e.data?.type === 'avatar-ready' && e.data.agentId === agent.id) {
              avatarFrames[agent.id].ready = true;
              clearTimeout(timeout);
              console.log(`[Host] Avatar ready: ${agent.id} (${agent.name})`);
              resolve();
            }

            if (e.data?.type === 'avatar-error' && e.data.agentId === agent.id) {
              clearTimeout(timeout);
              reject(new Error(e.data.error));
            }

            // Relay SDK events to server via Puppeteer-exposed functions
            if (e.data?.type === 'speech-delta' && e.data.agentId) {
              window.__onSpeechDelta(e.data.agentId, e.data.text);
            }
            if (e.data?.type === 'speech-end' && e.data.agentId) {
              window.__onSpeechEnd(e.data.agentId, e.data.fullText);
            }
            if (e.data?.type === 'talk-state' && e.data.agentId) {
              window.__onTalkState(e.data.agentId, e.data.state);
            }
            if (e.data?.type === 'response-start' && e.data.agentId) {
              window.__onResponseStart(e.data.agentId);
            }
            if (e.data?.type === 'tool-effect' && e.data.agentId) {
              window.__onToolEffect(e.data.agentId, e.data.toolName, JSON.stringify(e.data.args || {}), e.data.callId);
            }
          });
        });
      });

      console.log('[Host] Waiting for avatars (45s timeout each)...');
      const results = await Promise.allSettled(readyPromises);
      const readyCount = results.filter(r => r.status === 'fulfilled').length;
      const failedCount = results.filter(r => r.status === 'rejected').length;
      if (failedCount > 0) {
        results.forEach((r, i) => {
          if (r.status === 'rejected') console.warn(`[Host] Avatar ${config.agents[i].id} failed: ${r.reason}`);
        });
      }
      if (readyCount === 0) {
        console.error('[Host] No avatars connected — aborting');
        window.__onHostReady();
        return;
      }
      console.log(`[Host] ${readyCount}/${config.agents.length} avatars ready. Capturing streams...`);

      // Helper: wait for video element to be truly playable
      async function waitForVideo(iframe, agentId, timeoutMs) {
        const start = Date.now();
        while (Date.now() - start < timeoutMs) {
          const v = iframe.contentDocument?.querySelector('video');
          if (v && v.readyState >= 2 && v.videoWidth > 0) {
            console.log(`[Host] Video ready for ${agentId}: readyState=${v.readyState} size=${v.videoWidth}x${v.videoHeight} paused=${v.paused}`);
            return v;
          }
          const state = v ? `readyState=${v.readyState} size=${v.videoWidth}x${v.videoHeight}` : 'no element';
          console.log(`[Host] Waiting for video ${agentId}: ${state} (${Math.round((Date.now() - start) / 1000)}s)`);
          await new Promise(r => setTimeout(r, 2000));
        }
        const v = iframe.contentDocument?.querySelector('video');
        console.warn(`[Host] Video wait timed out for ${agentId}: readyState=${v?.readyState ?? 'none'} size=${v?.videoWidth ?? 0}x${v?.videoHeight ?? 0}`);
        return v;
      }

      // Canvas-based video capture: draws video frames to a canvas, then captures
      // the canvas stream. This BYPASSES Chrome's compositor — which is why direct
      // captureStream() on WebRTC <video> elements fails in Docker (Chrome optimizes
      // WebRTC video decode to skip compositor rendering).
      function createCanvasCapture(video, agentId) {
        const w = video.videoWidth || 420;
        const h = video.videoHeight || 420;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        // Render loop: copy video pixels to canvas.
        // Uses setInterval (NOT requestAnimationFrame) because rAF doesn't fire
        // in Xvfb/background Chrome — it's tied to display vsync/visibility.
        let frameCount = 0;
        setInterval(() => {
          if (video.readyState >= 2 && video.videoWidth > 0) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            frameCount++;
          }
        }, 66); // ~15fps

        // Canvas captureStream always produces a video track
        const canvasStream = canvas.captureStream(15); // 15fps
        const videoTrack = canvasStream.getVideoTracks()[0];

        // Audio still comes from the video's captureStream (audio is unaffected)
        const audioStream = video.captureStream();
        const audioTrack = audioStream.getAudioTracks()[0];

        console.log(`[Host] Canvas capture for ${agentId}: ${w}x${h} video=${!!videoTrack} audio=${!!audioTrack}`);

        // Log frame count after 3s to verify rendering
        setTimeout(() => {
          console.log(`[Host] Canvas ${agentId}: ${frameCount} frames rendered in 3s`);
        }, 3000);

        return { videoTrack, audioTrack };
      }

      // Capture + publish per agent (each agent = separate LiveKit participant)
      const livekitUrl = config.livekit?.url;
      let totalPublished = 0;
      for (const agent of config.agents) {
        if (!avatarFrames[agent.id]?.ready) continue;

        const iframe = avatarFrames[agent.id].iframe;
        const video = await waitForVideo(iframe, agent.id, 20000);
        if (!video) {
          console.error(`[Host] No <video> element for ${agent.id} — skipping`);
          continue;
        }

        // Force play if paused
        if (video.paused) {
          try { await video.play(); } catch(e) { console.warn(`[Host] play() failed for ${agent.id}: ${e.message}`); }
        }

        // Use canvas-based capture (bypasses compositor)
        const { videoTrack: vt, audioTrack: at } = createCanvasCapture(video, agent.id);

        if (!livekitUrl || !agent.livekitToken) {
          console.warn(`[Host] No LiveKit config for ${agent.id} — skipping publish`);
          continue;
        }

        try {
          const room = new Room();
          await room.connect(livekitUrl, agent.livekitToken);
          console.log(`[Host] ${agent.name} connected to LiveKit as host-${agent.id}`);

          if (vt) {
            await room.localParticipant.publishTrack(
              new LocalVideoTrack(vt, undefined, false),
              { name: `${agent.id}_video` },
            );
            totalPublished++;
            console.log(`[Host] Published video for ${agent.id}`);
          } else {
            console.error(`[Host] NO video track to publish for ${agent.id}`);
          }
          if (at) {
            await room.localParticipant.publishTrack(
              new LocalAudioTrack(at, undefined, false),
              { name: `${agent.id}_audio` },
            );
            totalPublished++;
            console.log(`[Host] Published audio for ${agent.id}`);
          }
        } catch (err) {
          console.error(`[Host] LiveKit publish failed for ${agent.id}: ${err.message}`);
        }
      }
      console.log(`[Host] LiveKit: ${totalPublished} tracks published across ${config.agents.length} agents`);

      window.__hostReady = true;
      window.__onHostReady();
      console.log('[Host] All streams published. Host ready!');
    };

    // ─── sendToAvatar: called by Puppeteer to send debate prompts ─────
    window.sendToAvatar = function(agentId, role, text, triggerResponse) {
      const frame = avatarFrames[agentId];
      if (!frame?.ready || !frame.iframe.contentWindow) return;
      frame.iframe.contentWindow.postMessage({
        type: 'send-message', agentId, role, text, triggerResponse,
      }, '*');
    };

    // ─── stopAvatar: called by Puppeteer to stop speech ───────────────
    window.stopAvatar = function(agentId) {
      const frame = avatarFrames[agentId];
      if (!frame?.ready || !frame.iframe.contentWindow) return;
      frame.iframe.contentWindow.postMessage({ type: 'stop-speaking', agentId }, '*');
    };
  </script>
</body>
</html>
